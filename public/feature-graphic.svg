<svg width="1024" height="500" viewBox="0 0 1024 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1024" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0066CC"/>
      <stop offset="50%" stop-color="#0052A3"/>
      <stop offset="100%" stop-color="#003D7A"/>
    </linearGradient>

    <!-- Card Subtle Gradient -->
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F5F7FA" stop-opacity="0.90"/>
    </linearGradient>

    <!-- Decorative Wavy Shapes -->
    <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#001F3F" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1024" height="500" fill="url(#bgGrad)"/>

  <!-- Background Decorative Vector Waves -->
  <path d="M-100 120 C 200 40, 400 200, 700 80 C 850 20, 950 140, 1120 60 L 1120 0 L -100 0 Z" fill="url(#waveGrad)"/>
  <path d="M-100 400 C 150 480, 450 320, 750 420 C 900 470, 1020 380, 1120 440 L 1120 500 L -100 500 Z" fill="url(#waveGrad)"/>

  <!-- Main Branding Title Text -->
  <text x="512" y="115" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" letter-spacing="-1">
    UtilityFlow
  </text>
  <text x="512" y="155" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="22" fill="#E6F0FA" letter-spacing="1">
    - 100% Offline Tools &amp; Calculators -
  </text>

  <!-- Feature Cards Grid (4 Rounded Cards) -->
  <g filter="url(#dropShadow)">
    <!-- Card 1: Calculators -->
    <g transform="translate(92, 195)">
      <rect width="192" height="230" rx="24" fill="url(#cardGrad)"/>
      <rect x="56" y="35" width="80" height="90" rx="16" fill="#0066CC" fill-opacity="0.1"/>
      <!-- Calculator Icon -->
      <rect x="71" y="50" width="50" height="60" rx="8" fill="#0066CC"/>
      <rect x="79" y="57" width="34" height="12" rx="3" fill="#FFFFFF"/>
      <circle cx="84" cy="78" r="4" fill="#FFFFFF"/>
      <circle cx="96" cy="78" r="4" fill="#FFFFFF"/>
      <circle cx="108" cy="78" r="4" fill="#FFFFFF"/>
      <circle cx="84" cy="94" r="4" fill="#FFFFFF"/>
      <circle cx="96" cy="94" r="4" fill="#FFFFFF"/>
      <rect x="104" y="90" width="8" height="8" rx="2" fill="#34C759"/>

      <text x="96" y="160" text-anchor="middle" font-family="-apple-system, sans-serif" font-weight="800" font-size="17" fill="#1D1D1F">Calculators</text>
      <text x="96" y="185" text-anchor="middle" font-family="-apple-system, sans-serif" font-weight="500" font-size="12" fill="#7A7A7A">Scientific &amp; Basic</text>
    </g>

    <!-- Card 2: Unit Converters -->
    <g transform="translate(308, 195)">
      <rect width="192" height="230" rx="24" fill="url(#cardGrad)"/>
      <rect x="56" y="35" width="80" height="90" rx="16" fill="#00B0FF" fill-opacity="0.1"/>
      <!-- Converter Arrows Icon -->
      <rect x="71" y="50" width="50" height="60" rx="8" fill="#00B0FF"/>
      <path d="M84 72 L108 72 M102 66 L108 72 L102 78" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M108 88 L84 88 M90 82 L84 88 L90 94" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

      <text x="96" y="160" text-anchor="middle" font-family="-apple-system, sans-serif" font-weight="800" font-size="17" fill="#1D1D1F">Converters</text>
      <text x="96" y="185" text-anchor="middle" font-family="-apple-system, sans-serif" font-weight="500" font-size="12" fill="#7A7A7A">Units &amp; Currency</text>
    </g>

    <!-- Card 3: Academic GPA -->
    <g transform="translate(524, 195)">
      <rect width="192" height="230" rx="24" fill="url(#cardGrad)"/>
      <rect x="56" y="35" width="80" height="90" rx="16" fill="#7C3AED" fill-opacity="0.1"/>
      <!-- Graduation Cap Icon -->
      <rect x="71" y="50" width="50" height="60" rx="8" fill="#7C3AED"/>
      <path d="M96 64 L77 74 L96 84 L115 74 Z" fill="#FFFFFF"/>
      <path d="M83 78 L83 92 C83 95, 109 95, 109 92 L109 78" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

      <text x="96" y="160" text-anchor="middle" font-family="-apple-system, sans-serif" font-weight="800" font-size="17" fill="#1D1D1F">GPA Manager</text>
      <text x="96" y="185" text-anchor="middle" font-family="-apple-system, sans-serif" font-weight="500" font-size="12" fill="#7A7A7A">Semester GPA/CGPA</text>
    </g>

    <!-- Card 4: Developer Tools -->
    <g transform="translate(740, 195)">
      <rect width="192" height="230" rx="24" fill="url(#cardGrad)"/>
      <rect x="56" y="35" width="80" height="90" rx="16" fill="#0284C7" fill-opacity="0.1"/>
      <!-- Code Brackets Icon -->
      <rect x="71" y="50" width="50" height="60" rx="8" fill="#0284C7"/>
      <path d="M88 72 L81 80 L88 88" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M104 72 L111 80 L104 88" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

      <text x="96" y="160" text-anchor="middle" font-family="-apple-system, sans-serif" font-weight="800" font-size="17" fill="#1D1D1F">Developer</text>
      <text x="96" y="185" text-anchor="middle" font-family="-apple-system, sans-serif" font-weight="500" font-size="12" fill="#7A7A7A">JSON &amp; Base64</text>
    </g>
  </g>
</svg>
